# Railway deployment configuration.
# Build: Nixpacks detects bun (bun.lock) for the Node build and python
# (requirements.txt) for the worker-agent dependencies used by LocalProvider.
# Deploy: one service, one port. server.ts runs Next.js AND the audio gateway
# in the same process, so Railway's single public port is sufficient.
#
# Required variables (set in the Railway dashboard, never committed):
#   DATABASE_URL      PostgreSQL (e.g. Supabase session-mode pooler):
#                     postgresql://postgres.<ref>:<URL-ENCODED-PASSWORD>@aws-1-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#                     Raw '# $ , ) &' in the password truncate the URL ->
#                     host/password are wrong - boot.ts auto-encodes them, but
#                     paste the encoded form to keep logs clean.
#   GATEWAY_SECRET    random 32+ byte string (signs session gateway tokens)
#   NEXTAUTH_SECRET   random 32+ byte string
#   APP_ORIGIN        https://<your-service>.up.railway.app
#   ADMIN_EMAIL / ADMIN_PASSWORD  bootstrap admin (seed-if-empty consumes them;
#                     there are NO default admin credentials in the codebase)
#
# Optional: VOXCORE_AGENT_PYTHON (pin the agent interpreter), EMAIL_MODE=smtp,
# GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET (enables Google sign-in).

[build]
builder = "NIXPACKS"

# Pin the Node major for Nixpacks. Without this Nixpacks defaulted to Node 18,
# which nixpkgs has removed (EOL) - the build failed in nix-env with
# "Node.js 18.x has reached End-Of-Life and has been removed".
# NIXPACKS_NODE_VERSION takes priority over .nvmrc and package.json engines
# (both also pinned to 20 as fallbacks).
[variables]
NIXPACKS_NODE_VERSION = "20"

[deploy]
# boot.ts = one orchestrator process:
#   auto-repair DATABASE_URL (raw '#'/'$'/','/')'/'&' in the password get
#   percent-encoded automatically, idempotent) -> env-doctor fail-fast ->
#   prisma db push with 3 retries -> seed (best-effort, never blocks
#   serving) -> unified server in-process on $PORT.
startCommand = "NODE_ENV=production bun scripts/boot.ts"
# /api/health always returns HTTP 200 while the process is up (the body
# honestly reports db status as ok/degraded). A DB blip therefore can never
# fail a rollout; use /api/health for humans, this for the platform.
healthcheckPath = "/api/health"
healthcheckTimeout = 120
# ALWAYS (not ON_FAILURE+maxRetries): with maxRetries the deployment is left
# DEAD after 3 failed restarts - that turned every transient boot error into
# a permanent 502. ALWAYS restarts indefinitely; combined with boot.ts
# retries the service self-heals when Supabase blips.
restartPolicyType = "ALWAYS"
