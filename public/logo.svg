<?xml version="1.0" encoding="utf-8"?>
<!-- VoxCore mark: five voice bars whose tops form a "V" valley.
     Legible at 16px; monochrome-safe; clear space = one bar width. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <rect width="28" height="28" rx="8" fill="#e11d2e"/>
  <rect x="5" y="11" width="2.5" height="10" rx="1.25" fill="#ffffff"/>
  <rect x="8.5" y="15" width="2.5" height="6" rx="1.25" fill="#ffffff"/>
  <rect x="12" y="18" width="2.5" height="3" rx="1.25" fill="#ffffff"/>
  <rect x="15.5" y="15" width="2.5" height="6" rx="1.25" fill="#ffffff"/>
  <rect x="19" y="11" width="2.5" height="10" rx="1.25" fill="#ffffff"/>
</svg>
